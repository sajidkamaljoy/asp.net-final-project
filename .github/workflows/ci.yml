name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # .NET Framework 4.7.2 projects, built with msbuild on a Windows runner.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore "Society Management/Society Management.sln"

      - name: Build
        run: msbuild "Society Management/Society Management.sln" /p:Configuration=Release /m
